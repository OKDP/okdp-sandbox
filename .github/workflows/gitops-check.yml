# Checks the deployments repository layout (gitops/): shapes, connection contracts,
# the layout compiles (okdp-gitops compile: every instance compiled with its package
# of the service catalogs, its values checked against the upstream charts) into the
# output tree scripts/configure.sh --push would push (never committed here),
# kustomize builds, helm template of every compiled instance.
#
# okdp-gitops is built from its repository, with okdp-compiler next to it (its go.mod
# replaces it). The service catalogs of gitops/platform/catalog.yaml
# (platform-charts, sandbox-dependencies) are cloned next to this repository at the
# ref the catalog names, where scripts/check.sh reads them. The upstream charts of
# the compiled umbrellas fill a chart cache (scripts/pull-charts.sh, from a first
# compile): nothing OKDP is pulled from a registry.

name: GitOps layout check

on:
  pull_request:
    paths:
      - "gitops/**"
      - "scripts/**"
      - ".github/workflows/gitops-check.yml"
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HELM_VERSION: v3.21.4   # same Helm 3 as OKDP/gh-workflows okdp-chart-ci.yml
  KUSTOMIZE_VERSION: v5.8.1
  # sha256 of kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz, from the
  # release's checksums.txt. Update both together.
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo ⚡️
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Clone okdp-gitops, okdp-compiler and the service catalogs 📥
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/OKDP/okdp-gitops.git ../okdp-gitops
          git clone --depth 1 https://github.com/OKDP/okdp-compiler.git ../okdp-compiler
          # The catalogs, at the ref gitops/platform/catalog.yaml names (yq is preinstalled).
          yq -r '.repositories[] | [.name, .ref] | @tsv' gitops/platform/catalog.yaml \
            | while IFS=$'\t' read -r name ref; do
                git clone --quiet --single-branch --branch "${ref}" "https://github.com/OKDP/${name}.git" "../${name}"
              done

      - name: Set up Go 🛠️
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ../okdp-gitops/go.mod
          cache: false

      - name: Build okdp-gitops 🛠️
        run: |
          set -euo pipefail
          (cd ../okdp-gitops && go build -o "${RUNNER_TEMP}/bin/okdp-gitops" ./cmd/okdp-gitops)
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Set up helm 🛠️
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Fill the chart cache with the upstream charts 📥
        run: |
          set -euo pipefail
          scripts/compile.sh --output "${RUNNER_TEMP}/output"
          scripts/pull-charts.sh --output "${RUNNER_TEMP}/output" "${RUNNER_TEMP}/charts"

      - name: Set up kustomize 🛠️
        run: |
          set -euo pipefail
          tgz="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "${RUNNER_TEMP}/${tgz}" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tgz}"
          echo "${KUSTOMIZE_SHA256}  ${RUNNER_TEMP}/${tgz}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tgz}" -C "${RUNNER_TEMP}" kustomize
          sudo install -m 0755 "${RUNNER_TEMP}/kustomize" /usr/local/bin/kustomize
          kustomize version; helm version

      - name: Check the layout ✅
        # yq v4 and jq are preinstalled on ubuntu-latest.
        run: scripts/check.sh --output "${RUNNER_TEMP}/output" --charts "${RUNNER_TEMP}/charts" --helm
