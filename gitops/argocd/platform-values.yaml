# ConfigMap okdp-releases/okdp-platform-values, built from the engine-neutral, generated
# compiled/platform/kustomization.yaml (the same objects as Flux's okdp-platform-values).
# The control plane server reads it under both engines.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: okdp-platform-values
  namespace: argocd
spec:
  project: okdp
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-deployments.git
    targetRevision: main
    path: compiled/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: okdp-releases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
