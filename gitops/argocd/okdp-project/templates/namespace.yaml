# Namespace <p>: the services cannot create it (no cluster-scoped resource in their
# AppProject, CreateNamespace included). Kept when the project is removed
# (Delete=false): the persistent volume claims left by the services stay until an
# administrator deletes the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: '{{ .Values.name }}'
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
