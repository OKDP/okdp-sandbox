# The project services: the Application <p>-<i> the compile writes for each,
# compiled/projects/<p>/services/<i>/application.yaml (a package: the umbrella chart of
# that directory in the output repository, with its instance.values.yaml; a plain
# chart: the chart from its registry, with the compiled values.yaml), applied by this
# Application (app of apps), from the output repository only. Each belongs to the
# AppProject project-<p> (projects.yaml), which only allows namespace <p>; its sync
# wave follows the instances it waits for (okdp.dependencies.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: okdp-services
  namespace: argocd
spec:
  project: okdp
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-deployments.git
    targetRevision: main
    path: compiled/projects
    directory:
      recurse: true
      include: '*/services/*/application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Unlimited: a service may wait for the platform on a first install.
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
