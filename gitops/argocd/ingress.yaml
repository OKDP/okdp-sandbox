# Argo CD UI at https://argocd.okdp.sandbox. ingress-nginx terminates TLS with a
# default-issuer certificate and re-encrypts to argocd-server, whose own certificate
# is self-signed, so Argo CD itself keeps its stock configuration.
# Applied at bootstrap before ingress-nginx and cert-manager exist: the Ingress
# waits until they come up.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: default-issuer
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.okdp.sandbox
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
  tls:
    - hosts:
        - argocd.okdp.sandbox
      secretName: argocd-server-ingress-tls
