# The platform components: the Application <project>-<instance> the compile writes for
# each, compiled/platform/components/<NN>-<i>/application.yaml (a package: the umbrella
# chart of that directory in the output repository, with its instance.values.yaml; a
# plain chart: the chart from its registry, with the compiled values.yaml), applied by
# this Application (app of apps), from the output repository only.
# Layer ordering: their sync waves (NN, plus the instances each waits for): a wave is
# applied when the Applications of the previous ones are Healthy, which needs the
# health assessment of Applications in argocd-cm (README, "Install with Argo CD").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: okdp-components
  namespace: argocd
spec:
  project: okdp
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-deployments.git
    targetRevision: main
    path: compiled/platform/components
    directory:
      recurse: true
      include: '*/application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # Unlimited: a layer may wait for the previous one on a first install.
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
