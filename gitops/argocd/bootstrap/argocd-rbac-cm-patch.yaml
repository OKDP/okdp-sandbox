# A merge patch of ConfigMap argocd/argocd-rbac-cm, applied once at bootstrap with
# argocd-cm-patch.yaml:
#   kubectl -n argocd patch configmap argocd-rbac-cm --type merge \
#     --patch-file gitops/argocd/bootstrap/argocd-rbac-cm-patch.yaml
# The roles of the users signed in with Keycloak, from the groups claim of their ID
# token (the realm roles, 20-keycloak): platform_admin (adm, alice) is admin, every
# other user read-only.
data:
  policy.csv: |
    g, platform_admin, role:admin
  policy.default: role:readonly
  scopes: "[groups]"
