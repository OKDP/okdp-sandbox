# One Application okdp-project-<p> per compiled project, compiled/projects/<p>/ (the
# compile writes it for every project), rendering the AppProject project-<p> from the
# okdp-project chart (next to this file). Argo CD reads the output repository only.
# <p> is the directory name, never a value read from a file of the project.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: okdp-projects
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-deployments.git
        revision: main
        directories:
          - path: compiled/projects/*
  template:
    metadata:
      name: 'okdp-project-{{ .path.basename }}'
      # Not okdp.io/project: the console lists the services of a project by that label.
      labels:
        okdp.io/appproject: 'project-{{ .path.basename }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: okdp
      source:
        repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-deployments.git
        targetRevision: main
        path: argocd/okdp-project
        helm:
          releaseName: 'okdp-project-{{ .path.basename }}'
          valuesObject:
            name: '{{ .path.basename }}'
            repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-deployments.git
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
