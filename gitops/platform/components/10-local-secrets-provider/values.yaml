# Platform component 10-local-secrets-provider: the OKDP package local-secrets-provider
# (sandbox-dependencies), the sandbox's stand-in for a secret manager. Every Secret is
# replicated to every namespace (kubernetes-replicator of 00-tools).
secrets:
  # Owner of the keycloak database (20-cnpg-postgresql) and secretRef of the platform
  # connection keycloak-db (20-keycloak).
  - name: creds-keycloak-db
    labels: {cnpg.io/reload: "true"}
    data:
      username: keycloak
      password: keycloak123
  # The platformAdmin identity of the object store (20-storage) and the secretRef of
  # the projects' s3 connection files.
  - name: creds-seaweedfs-s3
    data:
      accessKey: snu8yoP6QAlY0ne4
      secretKey: PNzBcmeLNEdR0oviwm04NQAicOrDH1Km
  # Write access of the console (30-okdp-control-plane-server) to the deployments
  # repositories served by 20-forgejo (same account as the Forgejo admin).
  - name: okdp-gitops-credentials
    data:
      username: okdp-admin
      password: okdp-sandbox-Passw0rd
  # The Keycloak service-account client of the console's user and group management
  # (30-okdp-control-plane-server keycloak.credentialsSecret; client of 20-keycloak).
  - name: okdp-control-plane-keycloak
    data:
      client_id: okdp-control-plane
      client_secret: myControlPlaneSecret
  # S3 identities of the demo project's services: the grants of 20-storage.
  - name: creds-hive-metastore-s3
    data:
      accessKey: hive-metastore
      secretKey: rdwFp4MRhDnGGsSJpNQ0CiMIFz56VseWIPMWgKBe
  - name: creds-trino-s3
    data:
      accessKey: trino
      secretKey: IthuzMjA3fWjGNdHCxE0KaJhx2zY8pxZmmkEqxHg
      S3_ACCESS_KEY: trino
      S3_SECRET_ACCESS: IthuzMjA3fWjGNdHCxE0KaJhx2zY8pxZmmkEqxHg
  - name: creds-jupyterhub-s3
    data:
      accessKey: jupyterhub
      secretKey: 4xABAzx5eHAfjf6SSbwFegO3eqrcz3yePEZH2oQz
      S3_ACCESS_KEY: jupyterhub
      S3_SECRET_KEY: 4xABAzx5eHAfjf6SSbwFegO3eqrcz3yePEZH2oQz
  - name: creds-spark-history-s3
    data:
      accessKey: spark-history
      secretKey: 9xWCGP9DWn4r9ikF4VhhOfBzbJsO0FpgW7DmIjQh
  - name: creds-polaris-s3
    data:
      accessKey: polaris
      secretKey: PNzBcmeLNEdR0oviwm04NQAicOrDH1Km
  - name: creds-examples-s3
    data:
      accessKey: okdp-examples
      secretKey: DiP4JtyptKQIVyEufZu2l74WIWYH5fK1tz6GrXgH
      S3_ACCESS_KEY: okdp-examples
      S3_SECRET_KEY: DiP4JtyptKQIVyEufZu2l74WIWYH5fK1tz6GrXgH
  # Owners of the demo project's databases (projects/demo/services/pg) and secretRef
  # of its connections/demo-db-*.yaml. Here rather than in the project's secrets:
  # CloudNativePG creates a managed role without a password when its passwordSecret
  # does not exist yet, and does not come back to it when the Secret appears (unless
  # the Secret carries the label cnpg.io/reload), so they must exist before the
  # cluster, and carry that label. Found on the kind e2e run (docs/no-kubocd-e2e.md).
  - name: creds-hive-metastore-db
    labels: {cnpg.io/reload: "true"}
    data: {username: hms, password: hms123}
  - name: creds-superset-db
    labels: {cnpg.io/reload: "true"}
    data: {username: superset, password: superset123}
  - name: creds-superset-examples-db
    labels: {cnpg.io/reload: "true"}
    data: {username: examples, password: examples123}
  - name: creds-polaris-db
    labels: {cnpg.io/reload: "true"}
    data: {username: polaris, password: polaris123}
  # Airflow: the owner role and the metadata connection string (metadataSecret).
  - name: creds-airflow-db
    labels: {cnpg.io/reload: "true"}
    data:
      username: airflow
      password: airflow123
      connection: postgresql+psycopg2://airflow:airflow123@demo-pg-rw.demo.svc.cluster.local:5432/airflow?sslmode=disable
