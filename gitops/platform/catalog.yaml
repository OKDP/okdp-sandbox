# Console service catalog (former Context spec.context.serviceCatalog), read and
# written by the control plane server through Git. Not a values layer.
# repositories: the catalogs of service packages, Git repositories holding
# catalog/<service>/<version>/ (an instance.yaml names <service> and <version>) and
# contracts/<contract>.schema.json, read at ref (a branch or a tag). A service name
# is unique across the catalogs. scripts/configure.sh --push copies them to Forgejo.
repositories:
  - name: platform-charts
    url: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/platform-charts.git
    ref: okdp-compiler
  - name: sandbox-dependencies
    url: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/sandbox-dependencies.git
    ref: okdp-compiler
# Console sidebar, one section per entry, in this order. A service sits in
# the section it is listed under. Icons are PrimeIcons names. A service's versions
# are the catalog/<service>/<version>/ directories of its catalog; the console
# offers the highest unless the entry sets default: "<version>".
categories:
  - title: Data Catalog
    icon: pi-warehouse
    services:
      - { name: hive-metastore, description: Hive metastore }
      - { name: polaris, description: Apache Polaris Iceberg catalog }
  - title: Database
    icon: pi-database
    services:
      - { name: cnpg-postgresql, description: PostgreSQL cluster (CloudNativePG) }
  - title: Query Engine
    icon: pi-bolt
    services:
      - { name: trino, description: Trino }
  - title: BI & Dataviz
    icon: pi-chart-bar
    services:
      - { name: superset, description: Superset }
  - title: Notebooks
    icon: pi-book
    services:
      - { name: jupyterhub, description: JupyterHub }
  - title: Workflows
    icon: pi-sitemap
    services:
      - { name: airflow, description: Apache Airflow }
  - title: Data Engineering
    icon: pi-microchip
    services:
      - { name: spark-history-server, description: Spark History Server }
