# Secrets of the demo project (former project-demo/10-secrets.yaml), provisioned by the
# same local stand-in the platform uses; an external secret manager replaces it in real
# deployments. Replicated to every namespace. The S3 identities of the services (the
# grants of 20-storage) and the database owners (services/pg) are in the platform
# component 10-local-secrets-provider: they must exist before the store and the
# PostgreSQL cluster start (see that file).
secrets:
  # OAuth clients, Keycloak secrets of 20-keycloak. The services' login clients
  # (creds-<release>-oauth2) are read with clientProvisioning: existing only (the
  # sandbox registers them by DCR, platform-values.yaml); the service accounts
  # (svc-*) are read in both modes.
  - name: creds-demo-trino-oauth2
    data: {client_id: trino, client_secret: myTrinoSecret}
  - name: creds-trino-oauth2-polaris
    data: {client_id: svc-trino-polaris-writer, client_secret: myTrinoPolarisSecret}
  - name: creds-demo-superset-oauth2
    data: {client_id: superset, client_secret: mySupersetSecret}
  - name: creds-demo-superset-oauth2-trino
    data: {client_id: superset-trino, client_secret: mySupersetTrinoSecret}
  - name: creds-demo-jupyterhub-oauth2
    data:
      client_id: jupyterhub
      client_secret: myJupyterHubSecret
      JUPYTERHUB_CRYPT_KEY: 335474192a3f8dc949df562a5e0249778100640a760dbfb16e988b6337a3314f
  - name: creds-demo-spark-history-oauth2
    data: {client_id: spark-history, client_secret: mySparkHistorySecret}
  - name: creds-demo-airflow-oauth2
    data: {client_id: airflow, client_secret: myAirflowSecret}
  - name: creds-demo-polaris-oauth2
    data: {client_id: polaris, client_secret: myPolarisSecret}
  # okdp-examples (optional layer 3, see gitops/optional/README.md).
  - name: creds-examples-oauth2-trino
    data: {client_id: svc-trino-examples-writer, client_secret: myTrinoExamplesSecret}
  - name: creds-polaris-oauth2-admin-okdp-sandbox
    data: {client_id: svc-polaris-api-admin, client_secret: myPolarisAdminSecret}
