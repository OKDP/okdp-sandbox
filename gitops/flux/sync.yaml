# Flux entry point. Bootstrap once, from the okdp-sandbox checkout, with:
#   kubectl apply -f gitops/flux/sync.yaml
# then Flux manages this directory in the output repository (Kustomization "okdp",
# path ./flux), where scripts/configure.sh --push puts it with the compiled tree and
# the generated components.yaml. GitRepository okdp-gitops is the output repository,
# the only one Flux reads: okdp-deployments in the mono topology (the sources and the
# output), okdp-output in io and split; compiled/, flux/, argocd/ at its root (paths
# ./flux, ./compiled/...). scripts/configure.sh --topology rewrites the URL of flux/ and
# argocd/.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: okdp-gitops
  namespace: flux-system
spec:
  interval: 1m
  url: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-deployments.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: okdp
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: okdp-gitops
  path: ./flux
  prune: true
