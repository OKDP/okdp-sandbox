<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1089px" height="337px" viewBox="0 0 1089 337"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="v11"><g><rect x="8" y="8" width="1064" height="312" fill="#ffffff" stroke="none" pointer-events="all" style="fill: rgb(255, 255, 255);"/></g></g><g data-cell-id="v12"><g><rect x="32" y="22" width="548" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57606A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(87, 96, 106);"><text x="34" y="37">Sandbox modes (prerequisites + OKDP Control Plane)</text></g></g></g><g data-cell-id="v13"><g><rect x="656" y="22" width="392" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57606A" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="12px" style="fill: rgb(87, 96, 106);"><text x="658" y="37">Projects on the cluster</text></g></g></g><g data-cell-id="v14"><g><rect x="32" y="52" width="532" height="104" rx="6" ry="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(87, 96, 106);"/></g></g><g data-cell-id="v15"><g><rect x="48" y="64" width="500" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(31, 35, 40);"><text x="50" y="81">Kubernetes mode (default · Quick start)</text></g></g></g><g data-cell-id="v16"><g><rect x="48" y="86" width="500" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57606A" font-family="Helvetica" text-anchor="start" font-size="11.5px" style="fill: rgb(87, 96, 106);"><text x="50" y="99.75">kubectl · clusters/sandbox/</text></g></g></g><g data-cell-id="v17"><g><rect x="48" y="108" width="500" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="start" font-size="11.5px" style="fill: rgb(36, 41, 47);"><text x="50" y="125.5">Installs sandbox prerequisites &amp; Control Plane with kubectl.</text><text x="50" y="139.5">Control Plane stores catalog &amp; projects in Kubernetes.</text></g></g></g><g data-cell-id="v18"><g><rect x="198" y="162" width="200" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0969DA" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="11px" style="fill: rgb(9, 105, 218);"><text x="298" y="176.5">↕  switch modes</text></g></g></g><g data-cell-id="v19"><g><rect x="32" y="188" width="532" height="114" rx="6" ry="6" fill="#f8fbff" stroke="#0969da" stroke-width="2" pointer-events="all" style="fill: rgb(248, 251, 255); stroke: rgb(9, 105, 218);"/></g></g><g data-cell-id="v20"><g><image width="20" height="20" xlink:href="data:image/svg+xml;base64," x="532" y="200"/></g></g><g data-cell-id="v21"><g><rect x="48" y="200" width="478" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0969DA" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(9, 105, 218);"><text x="50" y="217">GitOps mode (docs/gitops.md)</text></g></g></g><g data-cell-id="v22"><g><rect x="48" y="222" width="500" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57606A" font-family="Helvetica" text-anchor="start" font-size="11.5px" style="fill: rgb(87, 96, 106);"><text x="50" y="235.75">Flux + Git · full GitOps (or Control Plane only)</text></g></g></g><g data-cell-id="v23"><g><rect x="48" y="244" width="500" height="50" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="start" font-size="11.5px" style="fill: rgb(36, 41, 47);"><text x="50" y="261.5">• Platform manifests: Flux reconciles prerequisites &amp; Control Plane install.</text><text x="50" y="275.5">• Control Plane in Git: commits catalog &amp; projects (path or own repo).</text></g></g></g><g data-cell-id="v24"><g><rect x="656" y="54" width="392" height="100" rx="6" ry="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(26, 127, 55);"/></g></g><g data-cell-id="v25"><g><rect x="672" y="66" width="360" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(31, 35, 40);"><text x="674" y="83">Console projects (e.g. analytics)</text></g></g></g><g data-cell-id="v26"><g><rect x="672" y="88" width="360" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57606A" font-family="Helvetica" text-anchor="start" font-size="11.5px" style="fill: rgb(87, 96, 106);"><text x="674" y="101.75">Created &amp; managed in OKDP UI</text></g></g></g><g data-cell-id="v27"><g><rect x="672" y="110" width="360" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="start" font-size="11.5px" style="fill: rgb(36, 41, 47);"><text x="674" y="127.5">Deploys data services from the catalog.</text></g></g></g><g data-cell-id="v28"><g transform="translate(0.5,0.5)"><rect x="656" y="191" width="392" height="108" rx="6" ry="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="7 5.6" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(140, 149, 159);"/></g></g><g data-cell-id="v29"><g><rect x="672" y="203" width="360" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2328" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(31, 35, 40);"><text x="674" y="220">Demo project (project-demo)</text></g></g></g><g data-cell-id="v30"><g><rect x="672" y="225" width="360" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#57606A" font-family="Helvetica" text-anchor="start" font-size="11.5px" style="fill: rgb(87, 96, 106);"><text x="674" y="238.75">Optional sample lakehouse in namespace demo</text></g></g></g><g data-cell-id="v31"><g><rect x="672" y="247" width="360" height="44" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#24292F" font-family="Helvetica" text-anchor="start" font-size="11.5px" style="fill: rgb(36, 41, 47);"><text x="674" y="264.5">Managed directly in the UI in Kubernetes mode,</text><text x="674" y="278.5">or imported into Git in GitOps mode.</text></g></g></g><g data-cell-id="e32"><g><path d="M 564 104 L 610 104 L 610 245" fill="none" stroke="#57606a" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(87, 96, 106);"/></g></g><g data-cell-id="e33"><g><path d="M 564 245 L 610 245" fill="none" stroke="#57606a" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(87, 96, 106);"/></g></g><g data-cell-id="e34"><g><path d="M 610 104 L 646.82 104" fill="none" stroke="#1a7f37" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(26, 127, 55);"/><path d="M 654.32 104 L 646.82 107.75 L 646.82 100.25 Z" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(26, 127, 55); stroke: rgb(26, 127, 55);"/></g></g><g data-cell-id="e35"><g transform="translate(0.5,0.5)"><path d="M 610 245 L 647.03 245" fill="none" stroke="#57606a" stroke-width="1.4" stroke-miterlimit="10" stroke-dasharray="5.6 5.6" pointer-events="stroke" style="stroke: rgb(87, 96, 106);"/><path d="M 654.43 245 L 647.03 248.7 L 647.03 241.3 Z" fill="#57606a" stroke="#57606a" stroke-width="1.4" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(87, 96,