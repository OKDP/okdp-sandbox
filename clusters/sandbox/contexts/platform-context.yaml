# Must exist before the Context below: releases would create it too late.
apiVersion: v1
kind: Namespace
metadata:
  name: okdp-system
---
# The platform Context, single source of platform truth: packages template
# against it, the Control Plane server reads it and manages serviceCatalog.
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Context
metadata:
  name: platform
  namespace: okdp-system
spec:
  context:
    ingress:
      suffix: okdp.sandbox
      className: nginx

    # The 5 URLs are maintained by hand (changing the realm or the suffix means changing all five).
    # In existing mode, the default client Secret name follows the creds-<release>-oauth2 convention.
    oidc:
      enabled: true
      issuerUri: https://keycloak.okdp.sandbox/realms/master
      authUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/auth
      tokenUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/token
      jwksUri: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/certs
      userinfoUrl: https://keycloak.okdp.sandbox/realms/master/protocol/openid-connect/userinfo
      displayName: keycloak
      scope: "openid profile email groups"
      usePKCE: true
      insecureSkipVerify: false
      clientProvisioning: existing

    proxy:
      httpProxy: ""
      httpsProxy: ""
      noProxy: ""

    certificateIssuers:
      selfSigned:
        name: default-issuer

    storageClass:
      data: standard
      workspace: standard

    serviceCatalog:
      defaultRepository: quay.io/okdp/platform-packages
      # Console sidebar, one section per entry, in this order. A service sits in
      # the section it is listed under. Icons are PrimeIcons names.
      # Written by the console too: a re-apply resets the catalog to this seed.
      categories:
        - title: Data Catalog
          icon: pi-database
          services:
            - { name: hive-metastore, versions: ["4.0.1-p02"], default: "4.0.1-p02", description: Hive metastore }
            - { name: polaris, versions: ["1.3.0-incubating-p09"], default: "1.3.0-incubating-p09", description: Apache Polaris Iceberg catalog }
        - title: Interactive Query
          icon: pi-bolt
          services:
            - { name: trino, versions: ["480.0.0-p21"], default: "480.0.0-p21", description: Trino }
        - title: SQL & BI
          icon: pi-chart-bar
          services:
            - { name: superset, versions: ["6.0.0-p05"], default: "6.0.0-p05", description: Superset }
        - title: Notebooks
          icon: pi-book
          services:
            - { name: jupyterhub, versions: ["4.3.3-p07"], default: "4.3.3-p07", description: JupyterHub }
        - title: Data Engineering
          icon: pi-cog
          services:
            - { name: airflow, versions: ["3.2.1-p09"], default: "3.2.1-p09", description: Apache Airflow }
        - title: Spark
          icon: pi-bolt
          services:
            - { name: spark-history-server, versions: ["3.5.1-p08"], default: "3.5.1-p08", description: Spark History Server }
