apiVersion: kubocd.kubotal.io/v1alpha1
kind: Context
metadata:
  name: platform
  namespace: kubocd-system
spec:
  # -- KuboCD context values for the platform layer.
  context:
    # -- Platform-wide defaults for ingress, certificates and storage classes.
    platform:
      proxy:
        httpProxy: ~
        httpsProxy: ~
        noProxy: ~
      ingress:
        suffix: okdp.sandbox
        className: nginx

      certificateIssuers:
        selfSigned:
          name: default-issuer

      storageClass:
        data: standard
        workspace: standard

    # -- Root-level ingress contract read by the (new) okdp-server.
    ingress:
      suffix: okdp.sandbox
      className: nginx

    # -- Catalog contract consumed by the (new) okdp-server console.
    okdp:
      packageRepository: quay.io/okdp/platform-packages
      services:
        - name: seaweedfs
          # TEMPORARY: personal ghcr build while OKDP/sandbox-dependencies#9 is in
          # review — the package now lives in quay.io/okdp/sandbox-dependencies.
          repository: ghcr.io/alex-mabrouk/okdp-packages
          default: 4.17.0-p4
          versions: ["4.17.0-p4","4.17.0-p3", "4.17.0-p2", "4.17.0-p1"]
          category: Storage
          description: SeaweedFS — S3-compatible distributed object storage.
        - name: hive-metastore
          default: 4.0.1-p01
          versions: ["4.0.1-p01"]
          category: Data-Catalog
          description: Central metadata repository for Hive tables and partitions.
        - name: polaris
          default: 1.3.0-incubating-p01
          versions: ["1.3.0-incubating-p01"]
          category: Data-Catalog
          description: Apache Polaris — REST catalog for Apache Iceberg.
        - name: trino
          default: 480.0.0-p06
          versions: ["480.0.0-p06"]
          category: Interactive-Query
          description: Trino — distributed SQL query engine.
        - name: superset
          default: 6.0.0-p01
          versions: ["6.0.0-p01"]
          category: Dataviz
          description: Apache Superset — dashboards and visual analytics.
        - name: jupyterhub
          default: 4.3.3-p02
          versions: ["4.3.3-p02", "4.3.3-p01"]
          category: Notebook
          description: JupyterHub — multi-user interactive notebooks.
        - name: airflow
          default: 3.2.1-p2
          versions: ["3.2.1-p2", "3.2.1-p1"]
          category: Workflows
          description: Apache Airflow — workflow orchestration and scheduling.
        - name: spark-history-server
          default: 3.5.1-p04
          versions: ["3.5.1-p04"]
          category: Spark
          description: Spark History Server — Spark application monitoring.
        - name: okdp-examples
          default: 1.2.0-p01
          versions: ["1.2.0-p01"]
          category: Applications
          description: Hands-on OKDP examples, notebooks and data workflows.

    # -- Identity
    # Set to "kubauth" to enable the built-in fallback IdP and its user/group management API.
    identity:
      provider: external

      # -- OIDC client the console UI receives at bootstrap through GET /api/capabilities.
      oidc:
        authority: https://keycloak.okdp.sandbox/realms/master
        clientId: okdp-ui
        scope: openid profile email groups offline_access
      # -- OIDC client provisioning
      provisioning:
        provider: keycloak
        keycloak:
          issuerUri: https://keycloak.okdp.sandbox/realms/master
          insecureSkipTLSVerify: true
          credentialsSecret:
            namespace: keycloak
            name: creds-okdp-provisioner
