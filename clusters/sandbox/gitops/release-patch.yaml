# Default values target the optional in-cluster Gitea server (docs/gitops.md).
# For an external Git server, edit gitUrl, gitBranch and gitPath (use "" for a
# dedicated repository) before pushing or applying clusters/sandbox/gitops.
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: okdp-control-plane-server
  namespace: kubocd-system
spec:
  parameters:
    persistenceMode: git
    gitUrl: http://git.git.svc.cluster.local/okdp/okdp-sandbox.git
    gitBranch: main
    gitPath: clusters/sandbox/control-plane
    gitSecretName: okdp-control-plane-git
