apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: keycloak
  namespace: kubocd-system
spec:
  description: Keycloak identity provider (oidc Connection producer)
  package:
    repository: quay.io/okdp/sandbox-dependencies/keycloak
    tag: 1.0.0
    interval: 30m
    timeout: 10m
  parameters:
    adminUser: admin
    adminPassword: admin
    memoryGi: 2
    cpu: 0.5
    db: kcd-cnpg-postgresql-keycloak
    realm:
      name: master
      displayName: "OKDP internal Realm"
      accessTokenLifespan: 3600
    users:
      - username: bob
        email: bob@okdp.io
        firstName: bob
        lastName: bob
        password: bob
        roles: [data_engineer]
      - username: mark
        email: mark@okdp.io
        firstName: mark
        lastName: mark
        password: mark
        roles: [data_scientist]
      - username: nina
        email: nina@okdp.io
        firstName: nina
        lastName: nina
        password: nina
        roles: [business_analyst]
      - username: grace
        email: grace@okdp.io
        firstName: grace
        lastName: grace
        password: grace
        roles: [data_steward]
      - username: alice
        email: alice@okdp.io
        firstName: alice
        lastName: alice
        password: alice
        roles: [platform_admin, polaris_service_admin, polaris_catalog_admin]
      - username: eve
        email: eve@okdp.io
        firstName: eve
        lastName: eve
        password: eve
        roles: [auditor]
      - username: adm
        email: adm@okdp.io
        firstName: adm
        lastName: adm
        password: adm
        roles: [ platform_admin, polaris_service_admin, polaris_catalog_admin ]
      - username: svc-spark-etl-polaris-writer
        serviceAccountClientId: svc-spark-etl-polaris-writer
        roles: [ data_engineer, data_scientist, business_analyst ]
      # Carries both Polaris management roles: split at your convenience.
      - username: svc-polaris-api-admin
        serviceAccountClientId: svc-polaris-api-admin
        roles: [ polaris_service_admin, polaris_catalog_admin ]
      - username: svc-trino-polaris-writer
        serviceAccountClientId: svc-trino-polaris-writer
        roles: [ platform_admin, polaris_service_admin, polaris_catalog_admin ]
    roles:
      - name: data_engineer
      - name: data_scientist
      - name: business_analyst
      - name: platform_admin
      - name: data_steward
      - name: auditor
      # Free names, mapped to the Polaris service_admin and catalog_admin roles.
      - name: polaris_service_admin
      - name: polaris_catalog_admin
    clients:
      - clientId: okdp-server
        name: okdp-server
        publicClient: true
        redirectUris:
          - "https://okdp-server.{{ .Context.ingress.suffix }}/swagger/oauth2-redirect.html"
        webOrigins:
          - "https://okdp-server.{{ .Context.ingress.suffix }}"
      - clientId: okdp-ui
        name: okdp-ui
        publicClient: true
        redirectUris:
          - "https://okdp-ui.{{ .Context.ingress.suffix }}"
          - "https://okdp-ui.{{ .Context.ingress.suffix }}/*"
        webOrigins:
          - "https://okdp-ui.{{ .Context.ingress.suffix }}"
        # groups is not a Keycloak built-in default: without it the token
        # exchange fails with "Invalid scopes".
        defaultClientScopes:
          - web-origins
          - acr
          - roles
          - profile
          - groups
          - basic
          - email
        optionalClientScopes:
          - offline_access
      - clientId: polaris-console
        name: polaris-console
        publicClient: true
        # One console per project, hence the trailing wildcard. Web origins
        # are compared literally and accept no wildcard but "*" alone, which
        # CORS on the token endpoint needs.
        redirectUris:
          - "https://polaris-console-*"
        webOrigins:
          - "*"
        defaultClientScopes:
          - web-origins
          - acr
          - roles
          - profile
          - groups
          - basic
          - email
        optionalClientScopes:
          - offline_access
      - clientId: seaweedfs-s3
        name: seaweedfs-s3
        publicClient: true
      - clientId: superset
        name: superset
        secret: mySupersetSecret
        publicClient: false
        redirectUris:
          - "https://*"
        webOrigins:
          - "https://*"
        defaultClientScopes:
          - web-origins
          - acr
          - roles
          - profile
          - groups
          - basic
          - email
        optionalClientScopes:
          - address
          - phone
          - organization
          - offline_access
          - microprofile-jwt
      - clientId: jupyterhub
        name: jupyterhub
        secret: myJupyterHubSecret
        publicClient: false
        redirectUris:
          - "https://*"
        webOrigins:
          - "https://*"
        defaultClientScopes:
          - web-origins
          - acr
          - roles
          - profile
          - groups
          - basic
          - email
        optionalClientScopes:
          - address
          - phone
          - organization
          - offline_access
          - microprofile-jwt
      - clientId: trino
        name: trino
        secret: myTrinoSecret
        publicClient: false
        redirectUris:
          - "https://*"
        webOrigins:
          - "https://*"
        defaultClientScopes:
          - web-origins
          - acr
          - roles
          - profile
          - groups
          - basic
          - email
        optionalClientScopes:
          - address
          - phone
          - organization
          - offline_access
          - microprofile-jwt
      - clientId: spark-history
        name: spark-history
        secret: mySparkHistorySecret
        publicClient: false
        redirectUris:
          - "https://*"
        webOrigins:
          - "https://*"
        defaultClientScopes:
          - web-origins
          - acr
          - roles
          - profile
          - groups
          - basic
          - email
        optionalClientScopes:
          - address
          - phone
          - organization
          - offline_access
          - microprofile-jwt
      - clientId: superset-trino
        name: superset-trino
        secret: mySupersetTrinoSecret
        publicClient: false
        redirectUris:
          - "https://*"
        webOrigins:
          - "https://*"
        defaultClientScopes:
          - web-origins
          - acr
          - roles
          - profile
          - groups
          - basic
          - email
        optionalClientScopes:
          - address
          - phone
          - organization
          - offline_access
          - microprofile-jwt
      - clientId: polaris
        name: polaris
        secret: myPolarisSecret
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        redirectUris:
          - "https://*"
        webOrigins:
          - "https://*"
        defaultClientScopes:
          - web-origins
          - acr
          - roles
          - profile
          - groups
          - basic
          - email
        optionalClientScopes:
          - address
          - phone
          - organization
          - offline_access
          - microprofile-jwt
      - clientId: airflow
        name: airflow
        secret: myAirflowSecret
        publicClient: false
        redirectUris:
          - "https://*"
        webOrigins:
          - "https://*"
        defaultClientScopes:
          - web-origins
          - acr
          - roles
          - profile
          - groups
          - basic
          - email
        optionalClientScopes:
          - address
          - phone
          - organization
          - offline_access
          - microprofile-jwt
      - clientId: svc-trino-polaris-writer
        name: svc-trino-polaris-writer
        secret: myTrinoPolarisSecret
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        defaultClientScopes:
          - groups
          - roles
          - profile
          - email
      - clientId: svc-trino-examples-writer
        name: svc-trino-examples-writer
        secret: myTrinoExamplesSecret
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        defaultClientScopes:
          - groups
          - roles
          - profile
          - email
      - clientId: svc-polaris-api-admin
        name: svc-polaris-api-admin
        secret: myPolarisAdminSecret
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        defaultClientScopes:
          - groups
          - roles
          - profile
          - email
      - clientId: svc-spark-etl-polaris-writer
        name: svc-spark-etl-polaris-writer
        secret: mySparkAppSecret
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        defaultClientScopes:
          - groups
          - roles
          - profile
          - email
    clientScopes:
      - name: groups
        description: "Groups scope"
        protocol: openid-connect
        attributes:
          include.in.token.scope: "false"
          display.on.consent.screen: "true"
        protocolMappers:
          - name: roles_map_to_groups
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            config:
              access.token.claim: "true"
              claim.name: groups
              id.token.claim: "true"
              introspection.token.claim: "true"
              jsonType.label: String
              lightweight.claim: "true"
              multivalued: "true"
              userinfo.token.claim: "true"
  targetNamespace: keycloak
  createNamespace: true
