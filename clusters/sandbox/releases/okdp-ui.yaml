apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: okdp-ui
  namespace: kubocd-system
spec:
  createNamespace: false
  description: OKDP UI - Web interface for the Open Kubernetes Data Platform
  package:
    interval: 30m
    repository: ghcr.io/alex-mabrouk/okdp-packages/okdp-ui
    tag: 0.6.0-p03
    timeout: 10m
  targetNamespace: okdp-server
