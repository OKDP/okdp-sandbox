apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: kubocd-webhooks
  namespace: kubocd-system
# failurePolicy=Fail: while its pod is down, every Release/Context write fails.
spec:
  description: Second stage of kubocd installation
  package:
    repository: quay.io/okdp/sandbox-dependencies/kubocd-webhooks
    # Follows the controller: the package wraps the matching kubocd-wh chart.
    tag: 1.0.0
    interval: 30m
    timeout: 10m
  parameters:
    replicaCount: 1
  targetNamespace: kubocd
  createNamespace: true
