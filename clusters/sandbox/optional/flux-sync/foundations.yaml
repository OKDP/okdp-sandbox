# Reconciles KuboCD, ClusterContracts and platform-owned Contexts from
# GitRepository/okdp-platform (created in Step 3 of docs/gitops.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: okdp-kubocd
  namespace: flux-system
  labels:
    okdp.io/flux-sync: sandbox
spec:
  interval: 5m
  retryInterval: 15s
  sourceRef:
    kind: GitRepository
    name: okdp-platform
  path: ./clusters/sandbox/flux
  prune: true
  wait: true
  timeout: 10m
  deletionPolicy: Orphan
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: okdp-contracts
  namespace: flux-system
  labels:
    okdp.io/flux-sync: sandbox
spec:
  interval: 5m
  retryInterval: 15s
  dependsOn:
    - name: okdp-kubocd
  sourceRef:
    kind: GitRepository
    name: okdp-platform
  path: ./clusters/sandbox/contracts
  prune: true
  wait: false
  deletionPolicy: Orphan
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: okdp-contexts
  namespace: flux-system
  labels:
    okdp.io/flux-sync: sandbox
spec:
  interval: 5m
  retryInterval: 15s
  dependsOn:
    - name: okdp-contracts
  sourceRef:
    kind: GitRepository
    name: okdp-platform
  path: ./clusters/sandbox/contexts
  prune: true
  wait: false
  deletionPolicy: Orphan
