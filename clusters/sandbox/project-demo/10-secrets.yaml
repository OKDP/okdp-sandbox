# Secrets of the demo project, provisioned by the same local stand-in the
# platform uses. An external secret manager replaces this in real deployments.
apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: demo-secrets
  namespace: demo
spec:
  description: Demo project secrets (local secret-manager stand-in)
  package:
    repository: quay.io/okdp/sandbox-dependencies/local-secrets-provider
    tag: 1.0.0-p06
    interval: 30m
    timeout: 10m
  parameters:
    secrets:

      # Hive Metastore
      - name: creds-hive-metastore-db
        data:
          username: "hms"
          password: "hms123"
      - name: creds-hive-metastore-s3
        data:
          accessKey: "hive-metastore"
          secretKey: "rdwFp4MRhDnGGsSJpNQ0CiMIFz56VseWIPMWgKBe"

      # Trino engine
      - name: creds-demo-trino-oauth2
        data:
          client_id: "trino"
          client_secret: "myTrinoSecret"
      # Trino catalogs (from trino.connections: bronze storage, silver/gold oidc)
      - name: creds-trino-s3
        data:
          accessKey: "trino"
          S3_ACCESS_KEY: "trino"
          secretKey: "IthuzMjA3fWjGNdHCxE0KaJhx2zY8pxZmmkEqxHg"
          S3_SECRET_ACCESS: "IthuzMjA3fWjGNdHCxE0KaJhx2zY8pxZmmkEqxHg"
      - name: creds-trino-oauth2-polaris
        data:
          client_id: "svc-trino-polaris-writer"
          client_secret: "myTrinoPolarisSecret"

      # Superset
      - name: creds-superset-db
        data:
          username: "superset"
          password: "superset123"
      - name: creds-superset-redis
        data:
          username: "redis"
          password: "redis123"
      - name: creds-superset-examples-db
        data:
          username: "examples"
          password: "examples123"
      - name: creds-demo-superset-oauth2
        data:
          client_id: "superset"
          client_secret: "mySupersetSecret"
      - name: creds-demo-superset-oauth2-trino
        data:
          client_id: "superset-trino"
          client_secret: "mySupersetTrinoSecret"

      # JupyterHub
      - name: creds-jupyterhub-s3
        data:
          accessKey: "jupyterhub"
          secretKey: "4xABAzx5eHAfjf6SSbwFegO3eqrcz3yePEZH2oQz"
          S3_ACCESS_KEY: "jupyterhub"
          S3_SECRET_KEY: "4xABAzx5eHAfjf6SSbwFegO3eqrcz3yePEZH2oQz"
      - name: creds-demo-jupyterhub-oauth2
        data:
          client_id: "jupyterhub"
          client_secret: "myJupyterHubSecret"
          JUPYTERHUB_CRYPT_KEY: "335474192a3f8dc949df562a5e0249778100640a760dbfb16e988b6337a3314f"

      # OKDP examples
      # Entries sharing a name merge, last write wins.
      - name: creds-examples-s3
        data:
          accessKey: "okdp-examples"
          secretKey: "DiP4JtyptKQIVyEufZu2l74WIWYH5fK1tz6GrXgH"
          S3_ACCESS_KEY: "okdp-examples"
          S3_SECRET_KEY: "DiP4JtyptKQIVyEufZu2l74WIWYH5fK1tz6GrXgH"
      - name: creds-examples-oauth2-trino
        data:
          client_id: "svc-trino-examples-writer"
          client_secret: "myTrinoExamplesSecret"

      # Spark History
      - name: creds-spark-history-s3
        data:
          accessKey: "spark-history"
          secretKey: "9xWCGP9DWn4r9ikF4VhhOfBzbJsO0FpgW7DmIjQh"
      - name: creds-demo-spark-history-oauth2
        data:
          client_id: "spark-history"
          client_secret: "mySparkHistorySecret"

      # Airflow
      - name: creds-demo-airflow-oauth2
        data:
          client_id: "airflow"
          client_secret: "myAirflowSecret"
      - name: creds-airflow-db
        data:
          connection: "postgresql+psycopg2://airflow:airflow123@demo-pg-rw.demo.svc.cluster.local:5432/airflow?sslmode=disable"


      # Polaris
      - name: creds-polaris-db
        data:
          username: "polaris"
          password: "polaris123"
      # The Polaris SeaweedFS identity for STS
      - name: creds-polaris-s3
        data:
          accessKey: "polaris"
          secretKey: "PNzBcmeLNEdR0oviwm04NQAicOrDH1Km"
      - name: creds-demo-polaris-oauth2
        data:
          client_id: "polaris"
          client_secret: "myPolarisSecret"
      # Realm 'sandbox' OIDC admin principal
      - name: creds-polaris-oauth2-admin-okdp-sandbox
        data:
          client_id: "svc-polaris-api-admin"
          client_secret: "myPolarisAdminSecret"
      # SeaweedFS
      - name: creds-seaweedfs-s3
        data:
          accessKey: "snu8yoP6QAlY0ne4"
          secretKey: "PNzBcmeLNEdR0oviwm04NQAicOrDH1Km"

  targetNamespace: demo
