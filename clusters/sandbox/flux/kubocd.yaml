---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kubocd-controller
  namespace: flux-system
spec:
  interval: 1m
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://quay.io/kubocd/charts/kubocd-ctrl
  ref:
    tag: v0.3.2

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubocd-controller
  namespace: flux-system
spec:
  interval: 1m
  serviceAccountName: kustomize-controller
  targetNamespace: kubocd
  storageNamespace: flux-system
  releaseName: kubocd-ctrl
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: 30
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 30
      remediateLastFailure: true
  chartRef:
    kind: OCIRepository
    name: kubocd-controller
    namespace: flux-system
  values:
    extraNamespaces:
      - name: kubocd-system
    config:
      # The controller reads Config resources from its own namespace only, so
      # everything the platform needs has to be set here rather than in a
      # Config shipped next to the Contexts.
      content:
        defaultContexts:
          - name: platform
            namespace: okdp-system
        # Optional, looked up in the Release namespace and applied after the
        # platform Context.
        defaultNamespaceContexts:
          - platform-services
          - project
    controller:
      enabled: true
      replicaCount: 1
      # Connections are gated in v0.3.2.
      featureGates:
        connections: true
      logger:
        mode: dev
        level: info
      metrics:
        enabled: false
        secured: false
